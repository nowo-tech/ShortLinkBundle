# Public short-link redirect (/s/{code}), outside any locale prefix and stateless (contract §3.5).
nowo_short_link_redirect:
    resource: '@NowoShortLinkBundle/Resources/config/routes/redirect.php'

# Management UI under ui.path_prefix (/short-links). A multi-tenant host imports it under its own prefix, e.g.
# prefix: /organizations/{uuid} with ui.tenant_route_parameter: uuid.
nowo_short_link_ui:
    resource: '@NowoShortLinkBundle/Resources/config/routes/ui.php'
